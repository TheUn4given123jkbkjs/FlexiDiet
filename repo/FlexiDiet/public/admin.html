<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FlexiDiet Admin Studio - Bảng điều khiển quản trị dữ liệu dinh dưỡng, AI và người dùng">
  <title>FlexiDiet | Quản trị hệ thống</title>
  <link rel="icon" type="image/png" href="pictures/brand.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/theme.css?v=2.1">
  <link rel="stylesheet" href="assets/css/app.css?v=2.0">
  <link rel="stylesheet" href="assets/css/shell.css?v=2.0">
  <link rel="stylesheet" href="assets/css/brand.css?v=1.0">
  <link rel="stylesheet" href="assets/css/responsive-fix.css?v=2.0">
  <link rel="stylesheet" href="assets/css/admin.css?v=1.5">
  <script src="assets/js/theme.js"></script>
</head>
<body class="fd-app">
<div class="fd-layout">
  <!-- Mobile Sidebar Backdrop -->
  <div class="fd-sidebar-backdrop" id="sidebarBackdrop" onclick="closeMobileSidebar()"></div>

  <!-- Sidebar Navigation -->
  <aside class="fd-sidebar" id="appSidebar" aria-label="Thanh điều hướng quản trị">
    <div class="fd-sidebar-top-row">
      <a class="fd-brand" href="admin.html" style="padding-bottom:20px;">
        <span class="fd-brand-mark"><i class="fa-solid fa-leaf" aria-hidden="true"></i>FlexiDiet</span>
        <span class="fd-brand-badge"><i class="fa-solid fa-shield-halved"></i>ADMIN</span>
      </a>
      <button class="fd-sidebar-close-btn" type="button" onclick="closeMobileSidebar()" aria-label="Đóng menu"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="fd-side-main">
      <nav class="fd-side-nav" id="nav"></nav>
    </div>
    <div class="fd-sidebar-footer">
      <div class="fd-tip-box">
        <i class="fa-solid fa-shield-halved"></i>
        <strong>Khu vực Quản trị viên</strong>
        <span>Chỉ tài khoản quyền Admin truy cập. Thay đổi danh mục ảnh hưởng đến các lần tính toán tiếp theo.</span>
      </div>
      <span class="fd-demo-tag"><i class="fa-solid fa-circle"></i> FlexiDiet Admin Studio</span>
    </div>
  </aside>

  <!-- Main Wrap -->
  <div class="fd-main-wrap">
    <header class="fd-topbar">
      <div class="fd-top-left">
        <button class="fd-hamburger-btn" id="sidebarToggle" type="button" aria-controls="appSidebar" aria-expanded="false" aria-label="Mở menu điều hướng" onclick="toggleMobileSidebar()"><i class="fa-solid fa-bars"></i></button>
        <span class="fd-breadcrumb"><span class="bc-prefix">Quản trị</span> <i class="fa-solid fa-chevron-right"></i> <strong id="crumb">Tổng quan hệ thống</strong></span>
      </div>
      <div class="fd-top-right">
        <span class="fd-top-badge" id="systemLiveBadge"><i class="dot"></i> Trực tuyến</span>
        <span class="fd-today" id="todayHeader"></span>
        <button class="fd-icon-button" id="theme-toggle" type="button" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện sáng/tối">
          <i class="fa-solid fa-moon"></i>
          <i class="fa-solid fa-sun"></i>
        </button>
        <a class="btn ghost sm admin-top-btn" href="app.html" title="Chuyển sang ứng dụng người dùng">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
          <span class="top-btn-text">Về Ứng dụng</span>
        </a>
        <button class="btn ghost sm danger admin-top-btn" onclick="logoutAdmin()" title="Đăng xuất khỏi tài khoản Quản trị">
          <i class="fa-solid fa-power-off"></i>
          <span class="top-btn-text">Đăng xuất</span>
        </button>
        <div class="fd-top-avatar" title="Admin Root"><i class="fa-solid fa-user-shield"></i></div>
      </div>
    </header>

    <main class="main-workspace" id="view"></main>
  </div>
</div>

<!-- Mobile Bottom Navigation Bar -->
<nav class="fd-mobile-nav" id="mnav" aria-label="Điều hướng nhanh điện thoại"></nav>

<!-- Floating Toast Notification -->
<div id="toast" role="status"></div>

<!-- Scripts -->
<script src="assets/js/api-client.js"></script>
<script src="assets/js/admin-config.js?v=1.6"></script>
<script src="assets/js/admin.js?v=1.6"></script>
</body>
</html>
