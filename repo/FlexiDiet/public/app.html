<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FlexiDiet - nhật ký dinh dưỡng và luyện tập của bạn">
  <title>FlexiDiet | Không gian sức khỏe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    // Client-side demo gate only; PHP sessions will replace it when backend is connected.
    (function () {
      try {
        if (location.protocol !== 'file:' && !localStorage.getItem('flexidiet-user')) {
          location.replace('index.html');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/shell.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/workout-heatmap.css">
  <script src="assets/js/theme.js"></script>
</head>
<body class="fd-app">
  <div class="fd-layout">
    <aside class="fd-sidebar" aria-label="Thanh điều hướng chính">
      <a href="app.html#dashboard" class="fd-brand" onclick="switchTab('dashboard'); return false;">
        <span class="fd-brand-mark"><i class="fa-solid fa-leaf"></i></span>
        <span>flexi<span class="fd-brand-em">diet</span><small>HEALTH STUDIO</small></span>
      </a>
      <div class="fd-side-main">
        <div class="fd-nav-caption">KHÔNG GIAN CỦA BẠN</div>
        <nav class="fd-side-nav" aria-label="Các trang">
          <button class="app-nav-link active" data-target="dashboard" onclick="switchTab('dashboard')"><i class="fa-solid fa-house"></i><span>Tổng quan</span></button>
          <button class="app-nav-link" data-target="food-log" onclick="switchTab('food-log')"><i class="fa-solid fa-utensils"></i><span>Nhật ký ăn uống</span></button>
          <button class="app-nav-link" data-target="workout-log" onclick="switchTab('workout-log')"><i class="fa-solid fa-person-running"></i><span>Luyện tập</span></button>
          <button class="app-nav-link" data-target="suggestions" onclick="switchTab('suggestions')"><i class="fa-regular fa-lightbulb"></i><span>Gợi ý món ăn</span></button>
        </nav>
        <div class="fd-nav-caption fd-nav-caption-spaced">QUẢN LÝ</div>
        <nav class="fd-side-nav" aria-label="Quản lý">
          <button class="app-nav-link" data-target="list" onclick="switchTab('list')"><i class="fa-solid fa-list-check"></i><span>Danh sách chi tiết</span></button>
          <button class="app-nav-link" data-target="profile" onclick="switchTab('profile')"><i class="fa-regular fa-user"></i><span>Hồ sơ của tôi</span></button>
        </nav>
        <details class="fd-legacy-details">
          <summary><i class="fa-solid fa-chevron-right"></i> Bản cũ / đối chiếu</summary>
          <button class="app-nav-link" data-target="board" onclick="switchTab('board')"><i class="fa-solid fa-table-columns"></i><span>Bảng Kanban cũ</span></button>
        </details>
      </div>
      <div class="fd-sidebar-footer">
        <div class="fd-tip-box"><i class="fa-solid fa-seedling"></i><strong>Mỗi ngày một chút</strong><span>Thói quen bền vững bắt đầu từ những điều nhỏ.</span></div>
        <span class="fd-demo-tag"><i class="fa-solid fa-circle"></i> Dữ liệu minh họa · Frontend demo</span>
      </div>
    </aside>
    <div class="fd-main-wrap">
      <header class="fd-topbar">
        <div class="fd-top-left">
          <span class="fd-breadcrumb">Ứng dụng <i class="fa-solid fa-chevron-right"></i> <strong id="currentPageLabel">Tổng quan</strong></span>
        </div>
        <div class="fd-top-right">
          <span class="fd-today" id="todayHeader"></span>
          <button class="fd-icon-button" id="theme-toggle" type="button" aria-label="Đổi giao diện sáng tối" title="Đổi giao diện sáng tối"><i class="fa-solid fa-moon"></i></button>
          <button class="fd-icon-button" type="button" onclick="switchTab('profile')" aria-label="Hồ sơ" title="Hồ sơ"><i class="fa-regular fa-user"></i></button>
          <div class="fd-top-avatar" aria-label="Ảnh đại diện"><i class="fa-solid fa-user"></i></div>
        </div>
      </header>
      <!-- The six original views are now independently maintained HTML files. -->
      <main class="main-workspace" id="mainWorkspace" aria-live="polite">
        <div class="fd-loading" id="pagesLoading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải giao diện...</div>
      </main>
    </div>
  </div>
  <nav class="fd-mobile-nav" aria-label="Điều hướng trên điện thoại">
    <button class="app-nav-link active" data-target="dashboard" onclick="switchTab('dashboard')"><i class="fa-solid fa-house"></i><span>Tổng quan</span></button>
    <button class="app-nav-link" data-target="food-log" onclick="switchTab('food-log')"><i class="fa-solid fa-utensils"></i><span>Ăn uống</span></button>
    <button class="app-nav-link" data-target="workout-log" onclick="switchTab('workout-log')"><i class="fa-solid fa-person-running"></i><span>Luyện tập</span></button>
    <button class="app-nav-link" data-target="suggestions" onclick="switchTab('suggestions')"><i class="fa-solid fa-wand-magic-sparkles"></i><span>Gợi ý</span></button>
    <button class="app-nav-link" data-target="profile" onclick="switchTab('profile')"><i class="fa-regular fa-user"></i><span>Hồ sơ</span></button>
  </nav>
  <div class="modal-backdrop" id="createQuickModal" onclick="handleCreateModalBackdrop(event)">
<div class="modal-dialog quick-create-box">
<div class="modal-head-row">
<h3><i class="fa-solid fa-plus text-blue"></i> Ghi lại hoạt động của bạn</h3>
<button class="modal-close-btn" onclick="closeCreateQuickModal()"><i class="fa-solid fa-xmark"></i></button>
</div>
<div class="create-type-tabs">
<button class="ct-tab active" id="ctTabFood" onclick="switchCreateTab('food')"><i class="fa-solid fa-utensils"></i> Ghi Món Ăn</button>
<button class="ct-tab" id="ctTabWorkout" onclick="switchCreateTab('workout')"><i class="fa-solid fa-person-running"></i> Ghi Bài Tập</button>
</div>
<!-- Food Form -->
<form id="quickFoodForm" onsubmit="handleQuickFoodSubmit(event)">
<div class="form-group">
<label>Tên Món Ăn</label>
<input class="jira-input" id="qfName" placeholder="VD: Bún Chả, Cơm Gà..." required="" type="text"/>
</div>
<div class="form-row">
<div class="form-group">
<label>Bữa Ăn</label>
<select class="jira-select" id="qfMeal">
<option value="breakfast">Bữa Sáng</option>
<option selected="" value="lunch">Bữa Trưa</option>
<option value="dinner">Bữa Tối</option>
<option value="snack">Bữa Phụ</option>
</select>
</div>
<div class="form-group">
<label>Calories (kcal)</label>
<input class="jira-input" id="qfCal" required="" type="number" value="450"/>
</div>
</div>
<div class="form-row">
<div class="form-group">
<label>Protein (g)</label>
<input class="jira-input" id="qfProt" type="number" value="25"/>
</div>
<div class="form-group">
<label>Carb (g)</label>
<input class="jira-input" id="qfCarb" type="number" value="50"/>
</div>
<div class="form-group">
<label>Fat (g)</label>
<input class="jira-input" id="qfFat" type="number" value="12"/>
</div>
</div>
<button class="btn-jira-create btn-full" style="margin-top: 14px;" type="submit">
<i class="fa-solid fa-plus"></i> Lưu vào nhật ký
        </button>
</form>
<!-- Workout Form -->
<form id="quickWorkoutForm" onsubmit="handleQuickWorkoutSubmit(event)" style="display:none;">
<div class="form-group">
<label>Môn Thể Thao</label>
<select class="jira-select" id="qwSport">
<option value="running">Chạy bộ (8.5 METs)</option>
<option value="cycling">Đạp xe (7.5 METs)</option>
<option value="gym">Tập Gym (5.0 METs)</option>
<option value="swimming">Bơi lội (8.0 METs)</option>
</select>
</div>
<div class="form-row">
<div class="form-group">
<label>Thời Gian Tập (phút)</label>
<input class="jira-input" id="qwDuration" type="number" value="30"/>
</div>
<div class="form-group">
<label>Calo sẽ được backend tính theo MET và cân nặng</label>
<small class="sub-muted">Calo được cộng vào ngân sách mặc định bằng 50% calo thô.</small>
</div>
</div>
<button class="btn-jira-create btn-full" style="margin-top: 14px;" type="submit">
<i class="fa-solid fa-plus"></i> Lưu buổi tập
        </button>
</form>
</div>
</div>
  <div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>
  <script src="assets/js/api-client.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script src="assets/js/workout-heatmap.js"></script>
  <script src="assets/js/backend-sync.js"></script>
  <script src="assets/js/pages-loader.js"></script>
</body>
</html>
