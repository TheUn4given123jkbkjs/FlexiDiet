<!-- FlexiDiet modular page: history (Nhật ký chi tiết) -->
<section class="page-view" id="view-history">
  <div class="view-inner-container">
    <div class="jira-section-header">
      <div>
        <span class="section-tag"><i class="fa-solid fa-clock-rotate-left"></i> Quản Lý &amp; Lịch Sử</span>
        <h2>Nhật Ký Chi Tiết Toàn Bộ Hoạt Động Trong Ngày</h2>
      </div>
      <div class="btn-group">
        <button class="btn-jira-create" type="button" onclick="switchTab('food'); switchFoodSubtab('catalog');">
          <i class="fa-solid fa-plus"></i> Ghi Thêm Món Ăn
        </button>
        <button class="btn-jira-tool" type="button" onclick="switchTab('workout')">
          <i class="fa-solid fa-dumbbell"></i> Ghi Buổi Tập
        </button>
      </div>
    </div>
    <div class="jira-table-card">
      <table class="jira-data-table">
        <thead>
          <tr>
            <th>Phân Loại</th>
            <th>Tên Món / Bài Tập</th>
            <th>Bữa / Thời Gian</th>
            <th>Khối Lượng / Thời Lượng</th>
            <th>Calo (kcal)</th>
            <th>Protein (g)</th>
            <th>Carb (g)</th>
            <th>Fat (g)</th>
            <th>Trạng Thái</th>
            <th>Thao Tác</th>
          </tr>
        </thead>
        <tbody id="listTableBody">
          <!-- Rendered dynamically by renderActivityList() from MySQL synced records -->
        </tbody>
      </table>
    </div>
  </div>
</section>
